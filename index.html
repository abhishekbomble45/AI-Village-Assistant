<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Village Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>🤖 AI Village Assistant</h1>

        <p>Ask your question in Marathi, Hindi or English</p>

        <div id="chat"></div>

        <div class="input-box">

            <input
                type="text"
                id="question"
                placeholder="Type your question..."
            >

            <button onclick="askAI()">Ask AI</button>

        </div>

    </div>

    <script src="/static/script.js"></script>

</body>

</html>
